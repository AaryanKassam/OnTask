<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OnTask</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand"><span class="mark"></span>OnTask</span>
    <span id="status" class="pill"></span>
  </header>

  <main id="main"></main>

  <section class="timer-panel">
    <label class="field">
      <span>Timer</span>
      <select id="timer">
        <option value="off">Off</option>
        <option value="pomodoro">Pomodoro · 25 min focus, 5 min break</option>
        <option value="sprint">Short sprints · 15 / 3</option>
        <option value="fiftyTwo">52 / 17</option>
        <option value="deep">Deep work · 90 / 20</option>
        <option value="flow">Flowtime · break when you stop</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <div id="custom-times" class="row" hidden>
      <label class="field small-field"><span>Focus (min)</span><input id="custom-focus" type="number" min="5" max="180" step="5"></label>
      <label class="field small-field"><span>Break (min)</span><input id="custom-break" type="number" min="1" max="60"></label>
    </div>
  </section>

  <details id="settings">
    <summary>Settings</summary>
    <label class="field">
      <span>Prompt me after this long off task</span>
      <select id="dwell">
        <option value="15">15 seconds (demo)</option>
        <option value="30">30 seconds</option>
        <option value="60">1 minute</option>
        <option value="120">2 minutes</option>
        <option value="300">5 minutes</option>
        <option value="600">10 minutes</option>
      </select>
    </label>
    <label class="field">
      <span>Ask if I’m still there after this long idle</span>
      <select id="idle">
        <option value="0">Never</option>
        <option value="2">2 minutes</option>
        <option value="5">5 minutes</option>
        <option value="10">10 minutes</option>
        <option value="15">15 minutes</option>
      </select>
    </label>
    <div class="field check-row">
      <label><input id="sound" type="checkbox"> Play a sound with prompts</label>
      <button id="test-sound" class="link" type="button">Test</button>
    </div>
    <form id="companion-form" class="field">
      <span>Companion app (links your phone and watches the screen)</span>
      <div class="row">
        <input id="companion-code" placeholder="Pairing code" autocomplete="off" spellcheck="false">
        <button class="secondary">Connect</button>
      </div>
      <span id="companion-status" class="muted small"></span>
    </form>
    <p class="muted small">Everything runs on this machine. With the companion, screenshots are judged by a model on this Mac and deleted straight away. Nothing is sent to any online service.</p>
  </details>

  <script src="popup.js" type="module"></script>
</body>
</html>
